name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# fin-assist modules are fetched from git, not the public proxy. A private one needs the
# secret GO_MODULES_TOKEN (read access to fin-assist repositories); public ones
# (fin-assist/contracts) work without it.
env:
  GOPRIVATE: github.com/fin-assist/*
  GOLANGCI_LINT_VERSION: v2.15.0 # same as Makefile

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Access to private modules
        env:
          TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/fin-assist/".insteadOf "https://github.com/fin-assist/"
          fi
      - name: go.mod is tidy
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: All tests belong to a suite
        run: make test-names
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: CHANGELOG.md format
        run: python3 scripts/changelog.py check
      - name: Collect unit statements coverage
        id: collect_unit
        continue-on-error: true
        run: make collect-unit
      - name: Require 80 percent unit statements coverage
        id: check_unit
        if: always() && steps.collect_unit.outcome == 'success'
        continue-on-error: true
        run: make check-unit
      - name: Collect integration statements coverage
        id: collect_integration
        continue-on-error: true
        run: make collect-integration
      - name: Require 80 percent integration statements coverage
        id: check_integration
        if: always() && steps.collect_integration.outcome == 'success'
        continue-on-error: true
        run: make check-integration
      - name: Collect api statements coverage
        id: collect_api
        continue-on-error: true
        run: make collect-api
      - name: Require 80 percent api statements coverage
        id: check_api
        if: always() && steps.collect_api.outcome == 'success'
        continue-on-error: true
        run: make check-api
      - name: Combined statements coverage (informational union)
        if: always() && steps.collect_unit.outcome == 'success' && steps.collect_integration.outcome == 'success' && steps.collect_api.outcome == 'success'
        run: make cover-combined
      - name: Coverage summary
        if: always()
        run: |
          for level in unit integration api combined; do
            echo "## $level coverage (Go statements)" >> "$GITHUB_STEP_SUMMARY"
            if [ -s "$level.report.txt" ]; then
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              cat "$level.report.txt" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'Coverage unavailable: suite collection or input validation failed.' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo 'Each suite requires total80 independently, with go-test-coverage v2.20.1 rounding. Combined is informational.' >> "$GITHUB_STEP_SUMMARY"
          echo "[Coverage artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID#artifacts)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            unit.out
            integration.out
            api.out
            *.jsonl
            *.coverage.txt
            *.report.txt
          if-no-files-found: error
      # Keep the existing required status check: low coverage cannot hide behind a green go job.
      - name: Require all three suites and thresholds
        if: always()
        env:
          COLLECT_UNIT: ${{ steps.collect_unit.outcome }}
          CHECK_UNIT: ${{ steps.check_unit.outcome }}
          COLLECT_INTEGRATION: ${{ steps.collect_integration.outcome }}
          CHECK_INTEGRATION: ${{ steps.check_integration.outcome }}
          COLLECT_API: ${{ steps.collect_api.outcome }}
          CHECK_API: ${{ steps.check_api.outcome }}
        run: |
          for outcome in "$COLLECT_UNIT" "$CHECK_UNIT" "$COLLECT_INTEGRATION" "$CHECK_INTEGRATION" "$COLLECT_API" "$CHECK_API"; do
            if [ "$outcome" != success ]; then
              echo 'Every suite must execute without skips and independently meet total80.' >&2
              exit 1
            fi
          done

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Access to private modules
        env:
          TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/fin-assist/".insteadOf "https://github.com/fin-assist/"
          fi
      # forbidigo keeps errors on the finerr constructors (grpc-api.md 5.2), see .golangci.yml.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Build once; stage artifacts are extracted below. GHCR publication remains FIN-148.
      - name: Build
        env:
          TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
        run: |
          secret=()
          if [ -n "$TOKEN" ]; then
            printf 'machine github.com login x-access-token password %s\n' "$TOKEN" > "$RUNNER_TEMP/netrc"
            secret=(--secret id=netrc,src="$RUNNER_TEMP/netrc")
          fi
          DOCKER_BUILDKIT=1 docker build "${secret[@]}" --build-arg VERSION="$GITHUB_SHA" -t bank-bff:ci .
          set +e
          output=$(docker run --rm bank-bff:ci help 2>&1)
          status=$?
          set -e
          test "$status" -eq 2
          grep -q 'usage:' <<< "$output"
      - name: HTTP image smoke test
        run: |
          # The default ENV=prod needs peers and identity (FIN-268): without them start fails closed.
          set +e
          docker run --rm bank-bff:ci serve > prod.log 2>&1
          status=$?
          set -e
          test "$status" = 1
          grep -q USER_GRPC_ADDR prod.log
          # ENV=dev serves the listeners without the public API.
          trap 'docker rm -f bank-bff-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name bank-bff-smoke -e ENV=dev -e SHUTDOWN_DELAY=0s \
            -p 127.0.0.1::8080 -p 127.0.0.1::9091 bank-bff:ci
          public=$(docker port bank-bff-smoke 8080/tcp)
          operational=$(docker port bank-bff-smoke 9091/tcp)
          curl --retry 20 --retry-all-errors --retry-delay 1 --max-time 2 --fail "http://$operational/readyz"
          curl --max-time 2 --fail "http://$operational/healthz"
          curl --max-time 2 --fail "http://$operational/metrics" -o metrics.txt
          grep -q go_goroutines metrics.txt
          for path in /metrics /healthz /readyz /v1/profile; do
            test "$(curl --max-time 2 -s -o /dev/null -w '%{http_code}' "http://$public$path")" = 404
          done
          docker stop --time 5 bank-bff-smoke
          test "$(docker inspect --format '{{.State.ExitCode}}' bank-bff-smoke)" = 0
      - name: Extract stage binary from the tested image
        run: python3 scripts/stage_artifact.py bank-bff bank-bff:ci stage-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: stage-bank-bff-${{ github.sha }}-linux-amd64
          path: stage-artifact/
          retention-days: 30
          if-no-files-found: error
