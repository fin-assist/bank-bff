        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags:
      - assistant
      operationId: askAssistant
      x-min-request-body-bytes: 65536
      summary: Задать вопрос
      description: |
        Создаёт вопрос и запускает генерацию ответа на сервере; ответ читается потоком `streamAnswer`.
        Попытка списывается при создании вопроса. Повтор с тем же `Idempotency-Key` не создаёт второй вопрос и
        не списывает попытку. Сохранённый успешный результат ключа воспроизводится до проверки лимита OFF_TOPIC.
        Отказы `CONSENT_REQUIRED`, `LIMIT_EXCEEDED` и `RATE_LIMITED` не сохраняются под ключом.

        Отдельная защита OFF_TOPIC (FIN-222): начальные конфигурационные значения assistant — 5 терминальных
        исходов за скользящие 7×24 часа после последнего сброса. Каждый случай учитывается один раз с завершения
        ответа; в момент completed_at + 7 суток он уже исключён. При числе случаев не меньше 5 новые вопросы и
        повторы блокируются: 429 `RATE_LIMITED`, без создания вопроса/ответа, вызова модели и списания попытки.
        `error.retry_at` — момент снижения числа уже сохранённых случаев ниже порога; при 5 случаях это первое
        истечение, при 7 — третье. `Retry-After` — положительная задержка до него.
        Уже принятые генерации продолжаются; новые OFF_TOPIC могут сдвинуть срок позже. Сброс всех случаев — только успешный финансовый `complete` с `charged: true`,
        в том числе уже запущенный ответ; он может снять блокировку раньше `retry_at`. Прочие исходы, включая
        `complete` с `charged: false`, не сбрасывают счётчик. Одновременные завершения упорядочиваются по пользователю:
        случаи до сброса удаляются, после него учитываются заново. История, поток существующего ответа и суточный
        остаток доступны. Повтор с тем же ключом после снятия блокировки проверяется заново; клиент не повторяет
        отказ автоматически в цикле. Полные правила и примеры — docs/api.md, раздел 7.
      parameters:
      - $ref: '#/components/parameters/ContentEncodingIdentity'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/XClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
            example:
              text: Сколько я трачу на Самокат?
              transfer_mode: with
      responses:
        '201':
          description: Вопрос создан, генерация запущена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
              example:
                question:
                  id: 01a10852-b340-77c5-9ba3-bb9964a666d0
                  role: user
                  currency: RUB
                  text: Сколько я трачу на Самокат?
                  created_at: '2026-10-04T22:10:00+03:00'
                answer_id: 01a10852-b341-7a10-8f3e-6c2d9b4a1e07
                remaining_limit: 4
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/assistant/messages/{answer_id}/events:
    get:
      tags:
      - assistant
      operationId: streamAnswer
      summary: Поток ответа (SSE)
      description: |
        Клиент открывает поток сразу после `askAssistant` / `retryAnswer` и переоткрывает после обрыва или
        возврата из фона. Для готового ответа приходят `snapshot` и терминальное событие сразу.

        Порядок: `snapshot` (всегда первым) → `chunk` / `block` / `source` / `chip` в любом порядке →
        терминальное `done` или `error`. При `error` попытка возвращается, ответ получает статус `failed`,
        уже показанные блоки клиент убирает; клиент показывает `user_message` события по общим правилам ошибок
        (совместимость со старым сервером — `text`) и «Повторить» только при
        `retryable: true`. Генерация дольше 3 минут (в том числе прерванная сбоем сервера) завершается `MODEL_ERROR`.
        Сбой сервера посреди потока — не `error`: поток закрывается без терминального события, клиент переоткрывает
        его по правилу «SSE — переподключение» (`info.description`) и получает снимок.
        Заменённый повтором ответ — 404.
      parameters:
      - $ref: '#/components/parameters/AnswerId'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/XClientVersion'
      responses:
        '200':
          description: Поток событий
          content:
            text/event-stream:
              schema:
                type: string
                description: 'SSE-поток. События: `snapshot`, `chunk`, `block`, `source`, `chip`, `done`, `error` — схемы
                  в `x-sse-events`.'
              example: |
                event: snapshot
                data: {"status": "generating", "blocks": [{"type": "text", "v": 1, "data": {"text": "За апрель — сентябрь на Самокат ушло **7 200 ₽**"}}], "chips": [], "source": null, "currency": "RUB"}

                event: chunk
                data: {"index": 0, "text": ", все операции — с июля."}

                event: done
                data: {"charged": true, "remaining_limit": 4}
          x-sse-events:
            snapshot:
              $ref: '#/components/schemas/AnswerSnapshotEvent'
            chunk:
              $ref: '#/components/schemas/AnswerChunkEvent'
            block:
              $ref: '#/components/schemas/AnswerBlockEvent'
            source:
              $ref: '#/components/schemas/AnswerSource'
            chip:
              $ref: '#/components/schemas/Chip'
            done:
              $ref: '#/components/schemas/AnswerDoneEvent'
            error:
              $ref: '#/components/schemas/AnswerErrorEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/assistant/messages/{answer_id}/retry:
    post:
      tags:
      - assistant
      operationId: retryAnswer
      summary: Повторить ответ
      description: |
        «Повторить» у неудачного ответа с `retryable: true` (сейчас — только `MODEL_ERROR`): тот же вопрос, новый ответ; неудачный ответ заменяется — вопрос в истории
        не дублируется. Попытка списывается заново (неудачная уже возвращена). Дальше — `streamAnswer` по новому
        `answer_id`. `RETRY_NOT_ALLOWED` (422) — ответ не в статусе `failed` с `retryable: true` или уже заменён. У ответов,
        сохранённых до FIN-159 (признак не записан), повтор решается по коду: `MODEL_ERROR` — разрешён.

        Отдельный лимит OFF_TOPIC — как у `askAssistant`: начальные значения 5 терминальных исходов за скользящие
        7×24 часа после последнего сброса; случай истекает ровно через 7 суток с завершения. Блокировка действует
        и на ответ с `retryable: true`: 429 `RATE_LIMITED` с `error.retry_at` (когда число уже сохранённых случаев станет меньше 5) и
        `Retry-After`, без нового ответа, вызова модели и списания. Сброс — только успешный финансовый `complete`
        с `charged: true`; ранее принятая генерация может завершиться и снять блокировку раньше `retry_at`.
        Сохранённый успешный результат ключа воспроизводится до проверки лимита, без повторного списания.
        Отказ не сохраняется под ключом; после снятия блокировки запрос можно повторить с тем же ключом.
        История, поток существующего ответа и суточный остаток доступны. Полные правила — docs/api.md, раздел 7.
      parameters:
      - $ref: '#/components/parameters/AnswerId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/XClientVersion'
      responses:
        '201':
          description: Новый ответ запущен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryResponse'
              example:
                answer_id: 01a10853-0c11-7d2e-9a4b-6f1e3c8d2a95
                remaining_limit: 4
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/assistant/limit:
    get:
      tags:
      - assistant
      operationId: getAssistantLimit
      summary: Остаток лимита
      description: |
        Только суточный остаток вопросов. Отдельная блокировка OFF_TOPIC (docs/api.md, раздел 7) его не меняет
        и не закрывает этот метод: положительный остаток не гарантирует приём нового вопроса или повтора.
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/XClientVersion'
      responses:
        '200':
          description: Лимит
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantLimit'
              example:
                remaining: 4
                daily_max: 5
                resets_at: '2026-10-05T00:00:00+03:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token (JWT, 15 мин). При 401 клиент вызывает `refreshTokens`, при неудаче — экран входа.
    verificationToken:
      type: apiKey
      in: header
      name: X-Verification-Token
      description: Секрет заявки на верификацию из `startPhoneVerification`. Только в заголовке — не в URL.
  parameters:
    ContentEncodingIdentity:
      name: Content-Encoding
      in: header
      required: false
      description: |
        Только отсутствующий заголовок или один токен identity без учёта регистра. Другие значения,
        включая gzip/br, список или несколько Content-Encoding, — 400 VALIDATION_ERROR после
        техработ/версии/авторизации, но до чтения тела/размера/распаковки/сервиса. HTTP OWS нормализуется,
        пустое значение не равно отсутствию. BFF проверяет все значения заголовка, не только первое;
        kin-openapi не заменяет проверку повторённых заголовков. Запросы не распаковываются;
        транспортный предел считает все UTF-8 байты исходного JSON, включая пробелы и escape.
      schema:
        type: string
        pattern: '^[iI][dD][eE][nN][tT][iI][tT][yY]$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUID на одно логическое действие пользователя; клиент хранит его до окончательного ответа и повторяет
        при повторе запроса. Повтор с тем же ключом и телом возвращает сохранённый ответ (сохраняются только
        2xx, 400 кроме `CLIENT_VERSION_UNSUPPORTED`, 413, 422) — 24 часа, для `refreshTokens` — 60 секунд. Исключение —
        BFF-only 413 REQUEST_TOO_LARGE всегда до ключа и не сохраняется.
        429 `RATE_LIMITED` на дубль в `startPhoneVerification` (номер занят у провайдера): сохраняется до своего
        `retry_at` и воспроизводится с пересчитанным от текущего момента `Retry-After`. Тот же ключ с другим телом —
        409 `IDEMPOTENCY_CONFLICT`; первый запрос ещё выполняется — 409 `REQUEST_IN_PROGRESS`.
        Исправленный ввод — новый ключ. Без заголовка — 400 `VALIDATION_ERROR`.
      schema:
        type: string
        format: uuid
    XClientVersion:
      name: X-Client-Version
      in: header
      required: true
      description: |
        Версия клиента `<платформа>/<версия>+<сборка>` (`android/0.2.5+41`): платформа — открытый код
        (`android`, `ios`, `web`), версия — `MAJOR.MINOR.PATCH`, сборка — целое число. Обязателен на всех
        запросах. Версия ниже минимальной для платформы, нет заголовка, значение не разобрано или платформа
        неизвестна — 400 `CLIENT_VERSION_UNSUPPORTED`, а не `VALIDATION_ERROR`: сервер проверяет заголовок до
        валидации запроса по схеме. Сравниваются только `MAJOR.MINOR.PATCH`, по порядку и как числа (не
        как строки): при минимальной `0.2.0` версия `0.10.0` проходит. Сборка не участвует, равная минимальной
        версия проходит. Значение можно подделать: только совместимость, логи и метрики, не авторизация и не
        лимиты. Браузерный preflight (`OPTIONS`) обрабатывается до всех проверок и не требует ни этого
        заголовка, ни `Authorization`.
      schema:
        type: string
        maxLength: 64
        pattern: ^[a-z][a-z0-9_]*/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\+[0-9]+$
      example: android/0.2.5+41
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Сквозная трассировка; клиент генерирует новый на каждую попытку, сервер возвращает эхом.
      schema:
        type: string
        format: uuid
    UploadId:
      name: upload_id
      in: path
      required: true
      description: ID загрузки.
      schema:
        type: string
    OperationId:
      name: id
      in: path
      required: true
      description: ID операции или пары переводов.
      schema:
        type: string
    AnswerId:
      name: answer_id
      in: path
      required: true
      description: ID ответа помощника.
      schema:
        type: string
  headers:
    XRequestId:
      description: Эхо `X-Request-Id` запроса.
      schema:
        type: string
    RetryAfter:
      description: Через сколько секунд повторить.
      schema:
        type: integer
        minimum: 0
  responses:
    BadRequest:
      description: 'Невалидный запрос: `VALIDATION_ERROR` (все нарушения в `details`) или `CLIENT_VERSION_UNSUPPORTED` (версия клиента ниже минимальной для платформы, заголовка `X-Client-Version` нет, его значение не разобрано или платформа неизвестна).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
              - field: amount_from
                code: OUT_OF_RANGE
                message: must be >= 0
    Unauthorized:
      description: 'Нет, невалидный или просроченный токен: `INVALID_TOKEN`, `TOKEN_EXPIRED`, `TOKEN_REVOKED`.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_TOKEN
              message: Token is invalid or expired
    Forbidden:
      description: 'Нет согласия или лимит исчерпан: `CONSENT_REQUIRED`, `LIMIT_EXCEEDED` (с `error.resets_at`).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: LIMIT_EXCEEDED
              message: Daily question limit exceeded
              resets_at: '2026-10-05T00:00:00+03:00'
    NotFound:
      description: '`NOT_FOUND` — ресурса нет или он чужой.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: Not found
    Conflict:
      description: 'Конфликт по `Idempotency-Key`: `IDEMPOTENCY_CONFLICT` (другое тело), `REQUEST_IN_PROGRESS` (с `Retry-After`).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: REQUEST_IN_PROGRESS
              message: Request with this Idempotency-Key is in progress
    RequestTooLarge:
      description: |
        `REQUEST_TOO_LARGE` — JSON-тело больше фактического транспортного предела BFF у шести операций
        с x-min-request-body-bytes. Минимальный поддерживаемый предел — 65 536 байт UTF-8 JSON целиком,
        включая пробелы и escape-последовательности; развёртывание может принимать больше, но не меньше.
        Проверка Content-Length и ограниченного чтения потока — до сервиса/ключа, отказ не сохраняется.
        Неизменённый запрос не повторяют; исправленное тело — новое действие
        (новый ключ у операций с Idempotency-Key). Не FILE_TOO_LARGE.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: REQUEST_TOO_LARGE
              message: JSON request body exceeds transport limit
              retryable: false
    PayloadTooLarge:
      description: '`FILE_TOO_LARGE` — файл больше `max_file_size_bytes`.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FILE_TOO_LARGE
              message: File exceeds 10 MB
    Unprocessable:
      description: |
        Запрос понят, но выполнить нельзя: `WRONG_FORMAT`, `CSV_NOT_ACCEPTED`, `WRONG_BANK`, `CONSENT_OUTDATED`,
        `TOO_MANY_RESULTS`, `SELECTION_NOT_FOUND`, `CATEGORY_NOT_ASSIGNABLE`, `RETRY_NOT_ALLOWED`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: WRONG_BANK
              message: OFX is not from T-Bank
    TooManyRequests:
      description: '`RATE_LIMITED` — превышен лимит запросов; `error.retry_at` и `Retry-After`.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: Too many attempts
              retry_at: '2026-10-04T22:27:00+03:00'
    InternalError:
      description: '`INTERNAL_ERROR` — внутренняя ошибка.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: Internal error
    ServiceUnavailable:
      description: '`MAINTENANCE` — техработы; `error.until` (может отсутствовать) и `Retry-After`.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: MAINTENANCE
              message: Maintenance in progress
              until: '2026-10-16T03:00:00+03:00'
  schemas:
    Range:
      type: object
      description: Полуинтервал `[from, to)`.
      required:
      - from
      - to
      properties:
        from:
          type: string
          format: date-time
          description: Начало, включительно.
        to:
          type: string
          format: date-time
          description: Конец, исключительно.
    Month:
      type: string
      description: Календарный месяц `YYYY-MM` в поясе профиля.
      pattern: ^\d{4}-(0[1-9]|1[0-2])$
      example: '2026-09'
    PeriodKey:
      type: string
      description: |
        Ключ календарного периода: `YYYY-MM` (месяц), `YYYY-Qn` (квартал), `YYYY` (год). Формат расширяется вместе
        с `PeriodType` (неделя — `YYYY-Www`); сервер возвращает ключи только в формате запрошенного `period`.
      pattern: ^\d{4}(-(0[1-9]|1[0-2])|-Q[1-4])?$
      example: '2026-Q3'
    PeriodType:
      type: string
      description: 'Тип периода: `month`, `quarter`, `year`. Открытый набор: клиент запрашивает только известные значения.'
      x-extensible-enum:
      - month
      - quarter
      - year
    TransferMode:
      type: string
      description: |
        Режим учёта переводов: `with` — с переводами, `without` — без переводов людям (входящих и исходящих).
        «Между своими счетами» исключается в обоих режимах. В запросах неизвестное значение сервер отклоняет 400;
        в ответах неизвестное значение клиент обрабатывает как `with`. Отсутствие поля в фильтре Поиска значит
        «без правил аналитики», а не `with`.
      x-extensible-enum:
      - with
      - without
    OperationKindCode:
      type: string
      description: |
        Направление (`kind`) в `operations_filter` и в запросе Поиска (FIN-82). Открытый набор: неизвестное значение
        клиент не отбрасывает, а показывает чипом «Как на „Аналитике“» и передаёт в запрос как есть; сервер
        принимает любой `kind`, который сам присылает.
      x-extensible-enum:
      - expense
      - income
    Coverage:
      type: string
      description: |
        Полнота данных за период: `complete` — весь период; `partial` — частично (подпись по `data_from`/`data_to`
        и `gaps`); `no_data` — данных нет. Неизвестное значение — как `partial`.
      x-extensible-enum:
      - complete
      - partial
      - no_data
    Money:
      type: integer
      format: int64
      description: Сумма в копейках.
    OperationsFilter:
      type: object
      description: |
        Параметры Поиска (`listOperations`) — из аналитики, чипов помощника и итога импорта. Клиент открывает Поиск
        с этими фильтрами, показывает их чипами, даёт править и сбросить. Фильтры без своего чипа
        (`transfer_mode`, `selection`) показываются одним чипом с `selection_name` или «Как на „Аналитике“».
        Отсутствующее поле — фильтра нет (в том числе `transfer_mode`: без него Поиск работает без правил аналитики).
      properties:
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
          nullable: true
        q:
          type: string
          nullable: true
        category_id:
          type: string
          nullable: true
        kind:
          $ref: '#/components/schemas/OperationKindCode'
        amount_from:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        amount_to:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        transfer_mode:
          type: string
          description: |
            Режим учёта переводов: `with` — с переводами, `without` — без переводов людям (входящих и исходящих).
            «Между своими счетами» исключается в обоих режимах. В запросах неизвестное значение сервер отклоняет 400;
            в ответах неизвестное значение клиент обрабатывает как `with`. Отсутствие поля в фильтре Поиска значит
            «без правил аналитики», а не `with`.
          x-extensible-enum:
          - with
          - without
          nullable: true
        selection:
          type: string
          nullable: true
          description: Непрозрачная выборка; клиент передаёт как есть.
        selection_name:
          type: string
          nullable: true
          description: Подпись выборки для чипа («Комиссии и проценты банку», «Самокат»). В запрос не передаётся.
    AnalyticsParams:
      type: object
      description: Параметры экрана «Аналитика».
      required:
      - period
      - date
      - transfer_mode
      properties:
        period:
          $ref: '#/components/schemas/PeriodType'
        date:
          $ref: '#/components/schemas/PeriodKey'
        transfer_mode:
          $ref: '#/components/schemas/TransferMode'
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
    UserMessage:
      type: string
      minLength: 1
      maxLength: 1000
      pattern: '[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]'
      description: |
        Безопасный обычный текст из единого каталога BFF (FIN-224), 1–1000 кодовых точек Unicode,
        хотя бы одна вне Unicode White_Space (точный набор — pattern и docs/api.md «Единое отображение ошибок»).
        Свойства user_message/error_user_message необязательны и не принимают null (optional<string> в docs/api.md):
        сервер опускает отсутствующее значение, не заменяет его null; error_user_message отсутствует у истории не failed.
        Не интерпретируется как HTML, Markdown, ссылка или команда. Сырой ввод, SQL, исключения и ответы
        провайдера/модели сюда не копируются; параметры шаблона типизированы и проверены BFF.
        Клиент показывает корректное значение и для неизвестного кода. Поле отсутствует — только у помощника
        возможен fallback на прежний безопасный text/error_text; иначе — локальный безопасный текст по прежним
        правилам известного кода и контекста. Общий текст по HTTP-статусу — только для неизвестного REST-кода.
        Поле присутствует, но null, другого типа, пустое, пробельное или длиннее лимита — локальный безопасный
        текст без подстановки legacy text/error_text. Ошибка этого необязательного поля не отменяет code,
        все прежние действия из раздела 8 docs/api.md и правил эндпоинта или метаданные повтора.
        Диагностический message никогда не используется для UI.
    ErrorSeverity:
      type: string
      description: |
        Только оформление: info — информация, warning — предупреждение, error — ошибка. Открытый код;
        свойства severity/error_severity необязательны и не принимают null (optional<code> в docs/api.md):
        сервер опускает отсутствующее значение, не заменяет его null; error_severity отсутствует у истории не failed.
        неизвестное, отсутствующее, null или значение другого типа — оформление error с сохранением
        корректного пользовательского текста. Не меняет исход операции, не разрешает повтор, не отменяет
        retry_at/Retry-After/retryable и не создаёт специальных действий по неизвестному коду.
      x-extensible-enum:
      - info
      - warning
      - error
    Error:
      type: object
      description: |
        Ровно одна ошибка на ответ. Специальные действия — только по известному `code`; неизвестный код
        отображается по корректному `user_message`, без него — безопасная общая ошибка по HTTP-статусу.
        Дополнительные поля конкретного кода (`retry_at`, `resets_at`, `until`) описаны здесь; новые
        поля могут появиться. Действия раздела8 применяются к этой REST-форме и явно описанным контекстам ErrorEvent,
        не к совпавшему коду AnswerErrorEvent/StreamError/истории.
        Корректный retryable=false имеет приоритет над прежним прямым/автоматическим повтором в неизменённом
        контексте по 429/409; отдельные известные auth/maintenance recovery flows — по info.description;
        true подчиняется ожиданию и условиям метода/ключа, отсутствие/некорректность — прежним безопасным правилам.
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Машиночитаемый код (реестр — `api.md`, раздел 8). Коды, которые бывают только в событиях потоков (`PROCESSING_FAILED`,
            `CANCELLED`, `MODEL_ERROR`, `CANNOT_ANSWER`, `OFF_TOPIC`), описаны в схемах событий.
          x-extensible-enum:
          - VALIDATION_ERROR
          - CLIENT_VERSION_UNSUPPORTED
          - REQUEST_TOO_LARGE
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          - TOKEN_REVOKED
          - CONSENT_REQUIRED
          - LIMIT_EXCEEDED
          - NOT_FOUND
          - IDEMPOTENCY_CONFLICT
          - REQUEST_IN_PROGRESS
          - FILE_TOO_LARGE
          - WRONG_FORMAT
          - CSV_NOT_ACCEPTED
          - WRONG_BANK
          - CONSENT_OUTDATED
          - TOO_MANY_RESULTS
          - SELECTION_NOT_FOUND
          - CATEGORY_NOT_ASSIGNABLE
          - RETRY_NOT_ALLOWED
          - RATE_LIMITED
          - INTERNAL_ERROR
          - MAINTENANCE
        message:
          type: string
          description: Для логов и отладки, не для UI.
        user_message:
          $ref: '#/components/schemas/UserMessage'
        severity:
          $ref: '#/components/schemas/ErrorSeverity'
        retryable:
          type: boolean
          description: |
            Только REST Error: необязательный non-null флаг двух гарантий одновременно — повторная отправка
            этого конкретного запроса безопасна по правилам идемпотентности метода И разрешена после ошибки.
            true не описывает метод глобально, не требует автоповтора, не обещает успех и не разрешает цикл.
            Корректный false запрещает прямой повтор/автоматическое переоткрытие SSE после этого REST-отказа,
            имеет приоритет над прежними прямыми таймерами429/409; только отсутствие/некорректность сохраняет legacy-повтор.
            После успешного документированного auth-flow исходная операция возобновляется с новым Authorization
            и ПРЕЖНИМ ключом при доказанных safety/TTL. У известного MAINTENANCE сохраняется отдельный сценарий
            экрана техработ: один контролируемый resume после Retry-After с тем же ключом/проверками; новый отказ
            не запускает цикл. Это не разрешение общего таймера или неизвестного кода; ввод пользователя сохраняется.
            Сохраняются метод/адрес/тело и тот же Idempotency-Key, если нужен; новый X-Request-Id у каждой попытки.
            В момент фактической отправки клиент снова проверяет ограничения и окно исходного ключа.
            Флаг не продлевает TTL (обычно 24ч, refresh 60с); retry_at OFF_TOPIC до7суток может выйти за него.
            Истёкший ключ нельзя автоматически заменять новым ради повтора. Корректирующие сценарии известных кодов
            сохраняются при false; исправленный ввод/файл или новое намерение — новое действие/ключ.
            Retry-After/retry_at остаются; resets_at — информация о квоте, severity/текст/HTTP-статус не дают разрешения.
            Permission исходного RPC задаёт сервис/usecase в optional RequestRetryInfo; BFF соединяет применимое
            разрешение с доказанной безопасностью ВСЕГО REST-запроса, включая другие RPC. Отсутствующая/невалидная
            деталь или недоказанный контекст дают false, без business-switch по причинам в BFF; собственный отказ
            BFF получает permission из транспортного обработчика, не UI-каталога. Один UUID ключа не доказывает его возраст/действительность;
            429/5xx и голые gRPC UNAVAILABLE/DEADLINE_EXCEEDED не доказывают безопасность POST после возможного эффекта.
            Поля нет (совместимость), null или неверный тип — без нового разрешения, с сохранением прежних безопасных
            правил метода/кода/сценария; ошибка поля не уничтожает другие метаданные. При сетевом отказе тела может
            не быть: действуют правила вызываемого метода. Это не assistant SSE/Message.retryable: там разрешён
            RetryAnswer — новая генерация с новым ключом, а не повтор исходного AskQuestion (docs/api.md FIN-224).
        details:
          type: array
          nullable: true
          description: Все найденные нарушения; сейчас только у `VALIDATION_ERROR`.
          items:
            $ref: '#/components/schemas/ErrorDetail'
        retry_at:
          type: string
          format: date-time
          nullable: true
          description: У `RATE_LIMITED` — когда можно повторить.
        resets_at:
          type: string
          format: date-time
          nullable: true
          description: У `LIMIT_EXCEEDED` — когда обновится лимит вопросов (полночь по Москве).
        until:
          type: string
          format: date-time
          nullable: true
          description: У `MAINTENANCE` — ожидаемое окончание техработ; нет — неизвестно. Для ожидания приоритетен свежий Retry-After в секундах, UI-datetime fallback — только через свежий Date того же ответа. false запрещает прямой retry; отдельный известный восстановительный сценарий экрана техработ — по info.description.
    ErrorDetail:
      type: object
      required:
      - code
      - message
      properties:
        field:
          type: string
          nullable: true
          description: Имя query-параметра или JSON-путь в теле (`filters.category_id`); нет — нарушение касается запроса
            целиком.
        code:
          type: string
          description: 'Код нарушения: `REQUIRED`, `INVALID_FORMAT`, `OUT_OF_RANGE`. Неизвестный — общая ошибка поля.'
          x-extensible-enum:
          - REQUIRED
          - INVALID_FORMAT
          - OUT_OF_RANGE
        message:
          type: string
    SseError:
      $ref: '#/components/schemas/ErrorEvent'
    ErrorEvent:
      type: object
      description: Универсальная внешняя форма события `error` после начала потока; прежнее имя SseError остаётся алиасом той же схемы. Новых wire-полей или generic retryable здесь нет. Неизвестный код — по корректному user_message,
        без него — безопасная общая ошибка сценария; в обоих случаях сохраняется прежнее предложение повторить
        вручную. severity на это не влияет. Ограничения сценария и ожидание RATE_LIMITED сохраняются;
        правило общего SSE не заменяет retryable события помощника.
        Сбой сервера или транспорта посреди потока сюда не приходит — поток закрывается без терминального события
        (`info.description`, «SSE — переподключение», FIN-159); `INTERNAL_ERROR` оставлен в списке для совместимости.
      required:
      - code
      - message
      properties:
        code:
          type: string
          x-extensible-enum:
          - INTERNAL_ERROR
        message:
          type: string
          description: Для логов и отладки, не для UI.
        user_message:
          $ref: '#/components/schemas/UserMessage'
        severity:
          $ref: '#/components/schemas/ErrorSeverity'
    StreamError:
      type: object
      description: |
        Терминальное событие `error` потока прогресса импорта: `PROCESSING_FAILED` — не удалось разобрать файл
        (в том числе разбор не завершился за 3 минуты — таймаут, FIN-159);
        `CANCELLED` — разбор прерван пользователем; без корректного user_message сохраняются прежнее безопасное
        сообщение и поведение отмены, а не ошибка разбора. Неизвестный код — по корректному user_message;
        без него — как `PROCESSING_FAILED`: «Не удалось разобрать файл». Источник причины — валидный внутренний
        вложенный Status (его открытый reason не ограничен старым enum); отсутствующий Status использует legacy adapter,
        невалидный присутствующий — code=PROCESSING_FAILED, legacy-код (включая CANCELLED) не читается.
        При absent Status legacy CANCELLED сохраняется. Совпадение с REST-кодом не запускает действия раздела8;
        действуют правила импорта, не auth/maintenance/quota или возобновление исходного Ask. При переподключении к неудачной
        загрузке BFF формирует эти поля по сохранённому коду и параметрам; в истории загрузок ошибки нет.
      required:
      - code
      - message
      properties:
        code:
          type: string
          x-extensible-enum:
          - PROCESSING_FAILED
          - CANCELLED
        message:
          type: string
          description: Для логов и отладки, не для UI.
        user_message:
          $ref: '#/components/schemas/UserMessage'
        severity:
          $ref: '#/components/schemas/ErrorSeverity'
    StartPhoneVerificationRequest:
      type: object
      required:
      - phone
      properties:
        phone:
          type: string
          description: Номер в формате E.164, только российские (`+7` и 10 цифр). Неверный формат — 400 `VALIDATION_ERROR`
            с нарушением у поля `phone` (`INVALID_FORMAT`), FIN-68.
          pattern: ^\+7\d{10}$
          example: '+79001234567'
    PhoneVerification:
      type: object
      required:
      - verification_token
      - callback_number
      - expires_at
      properties:
        verification_token:
          type: string
          description: Секрет заявки (256 случайных бит, base64url). Хранится в памяти до окончания входа, передаётся только
            в `X-Verification-Token`.
        callback_number:
          type: string
          description: Номер подтверждения, на который пользователь звонит со своего телефона (E.164); клиент показывает его
            и передаёт в `ACTION_DIAL`. Звонок оплачивается по тарифу абонента — не бесплатный. Номер может быть общим для
            многих пользователей; звонок засчитывается только с номера из заявки и только пока она действует. Не
            зашивается в приложение.
        expires_at:
          type: string
          format: date-time
          description: Срок жизни заявки по часам сервера; задаёт сервер (сейчас 5 минут с создания — срок заявки у
            провайдера). Для отсчёта на устройстве клиент его не использует (см. `expires_in`) и длительность не
            зашивает. После него — новая заявка с новым `Idempotency-Key`.
        expires_in:
          type: integer
          minimum: 0
          description: Оставшийся срок заявки в секундах на момент отправки ответа (`expires_at` минус время сервера,
            округлено вниз, не меньше 0). Пересчитывается при каждой отправке, в том числе при повторе сохранённого ответа
            по `Idempotency-Key`. Клиент уменьшает длительность по монотонному elapsed time с учётом сна,
            а местную подпись «до ЧЧ:ММ» строит от часов получения плюс длительность. Нет поля (старый сервер) —
            приблизительный UI-fallback через Date того же свежего ответа; без базы — обновить состояние,
            старую длительность не перезапускать (info.description, «Время ожидания и часы»).
          example: 300
    PhoneVerificationStatusEvent:
      type: object
      description: Событие `status` потока верификации.
      required:
      - status
      properties:
        status:
          type: string
          description: |
            `pending` — звонка ещё не было; `verified` — номер подтверждён (терминальное); `expired` — срок заявки
            истёк (терминальное). Неизвестный статус — заявка не удалась, предложить начать заново.
          x-extensible-enum:
          - pending
          - verified
          - expired
        is_new_user:
          type: boolean
          nullable: true
          description: 'Только при `verified`: `true` — номера нет в системе, показать экран согласия и вызвать `register`.'
        access_token:
          type: string
          nullable: true
          description: 'Только при `verified` и `is_new_user: false`.'
        refresh_token:
          type: string
          nullable: true
          description: 'Только при `verified` и `is_new_user: false`.'
        registration_token:
          type: string
          nullable: true
          description: 'Только при `verified` и `is_new_user: true`; одноразовый, живёт 15 минут с момента подтверждения
            звонком (`verified`), а не до `expires_at` заявки. После срока 1.3 отвечает 401 `TOKEN_EXPIRED`.'
    RegisterRequest:
      type: object
      required:
      - registration_token
      - pd_consent_accepted
      - pd_consent_version
      properties:
        registration_token:
          type: string
          description: Из события `verified`.
        pd_consent_accepted:
          type: boolean
          description: Согласие на обработку ПДн; `false` → 403 `CONSENT_REQUIRED`.
        pd_consent_version:
          type: string
          description: Версия документа (`getConsentDocument`, `personal_data`), который видел пользователь. Устаревшая →
            422 `CONSENT_OUTDATED`.
        timezone:
          type: string
          description: Часовой пояс устройства (IANA); без поля — `Europe/Moscow`.
          example: Europe/Moscow
    RegisterResponse:
      type: object
      required:
      - access_token
      - refresh_token
      - user_id
      properties:
        access_token:
          type: string
          description: JWT, 15 мин.
        refresh_token:
          type: string
        user_id:
          type: string
    RefreshTokenRequest:
      type: object
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
    TokenPair:
      type: object
      required:
      - access_token
      - refresh_token
      properties:
        access_token:
          type: string
          description: Новый JWT, 15 мин.
        refresh_token:
          type: string
          description: Новый refresh token; старый с этого момента невалиден.
    ConsentDocument:
      type: object
      required:
      - type
      - version
      - title
      - url
      properties:
        type:
          type: string
          x-extensible-enum:
          - personal_data
          - assistant
        version:
          type: string
          description: Текущая версия — её клиент передаёт в `register` или `grantAssistantConsent`.
        title:
          type: string
          description: Название документа для ссылки.
        url:
          type: string
          format: uri
          description: Полный текст документа.
    Theme:
      type: string
      description: Тема оформления в ответе. Открытый набор (FIN-82) — неизвестное значение клиент обрабатывает как `system`.
      x-extensible-enum:
      - system
      - light
      - dark
    ThemeUpdate:
      type: string
      description: Новая тема в `PATCH /v1/profile` — одно из значений, которые знает сервер.
      enum:
      - system
      - light
      - dark
    Profile:
      type: object
      required:
      - user_id
      - phone
      - theme
      - timezone
      - consents
      - created_at
      properties:
        user_id:
          type: string
        phone:
          type: string
          description: Номер полностью, E.164 — логин пользователя; показывается целиком, форматирует клиент.
        theme:
          $ref: '#/components/schemas/Theme'
        timezone:
          type: string
          description: Часовой пояс (IANA), в котором считаются месяцы и «сегодня».
        consents:
          type: array
          description: |
            Согласия пользователя, по одному на тип (FIN-82); новый тип — новый элемент. Нет элемента нужного типа —
            согласия нет. Согласие на ПДн сюда не входит.
          items:
            $ref: '#/components/schemas/Consent'
        created_at:
          type: string
          format: date-time
          description: Дата регистрации.
    Consent:
      type: object
      required:
      - type
      - granted
      - current_version
      properties:
        type:
          type: string
          description: '`assistant` — передача данных помощнику (Alice AI). Элемент с неизвестным типом клиент пропускает.'
          x-extensible-enum:
          - assistant
        granted:
          type: boolean
          description: Действует ли согласие.
        version:
          type: string
          nullable: true
          description: Версия документа, на которую дано согласие.
        current_version:
          type: string
          description: Текущая версия документа; если `version` старше — согласие нужно дать заново.
    ProfileUpdate:
      type: object
      description: Любое подмножество полей.
      properties:
        theme:
          $ref: '#/components/schemas/ThemeUpdate'
        timezone:
          type: string
          description: Новый часовой пояс (IANA). Клиент отправляет, когда новый пояс устройства держится не меньше
            72 часов (FIN-91); правило и триггеры — `api.md`, 2.2. Сервер правило не проверяет.
    AssistantConsentGrant:
      type: object
      required:
      - version
      properties:
        version:
          type: string
          description: Версия документа (`getConsentDocument`, `assistant`), который видел пользователь. Устаревшая → 422
            `CONSENT_OUTDATED`.
    ImportConfig:
      type: object
      required:
      - download_url
      - login_url
      - max_file_size_bytes
      - accepted_formats
      - suggested_period
      properties:
        download_url:
          type: string
          format: uri
          description: Ссылка выгрузки OFX за `suggested_period` («Скачать за год»), открывается в браузере.
        login_url:
          type: string
          format: uri
          description: Вход в кабинет Т-Банка в браузере («Войти в Т-Банк»).
        max_file_size_bytes:
          type: integer
          format: int64
          description: Максимальный размер файла («Файл OFX до 10 МБ»).
        accepted_formats:
          type: array
          description: Принимаемые форматы для показа. Проверку формата делает сервер.
          items:
            type: string
        suggested_period:
          allOf:
          - $ref: '#/components/schemas/Range'
          description: 12 месяцев назад для первой загрузки, от начала дня последней загруженной операции — для повторной;
            `to` — начало завтрашнего дня.
        loaded:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/LoadedSummary'
          description: Что уже загружено. Нет — загрузок ещё не было (первая загрузка, «Загружу позже»).
          type: object
    LoadedSummary:
      type: object
