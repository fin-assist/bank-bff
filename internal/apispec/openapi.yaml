  /v1/operations/{id}:
    get:
      tags:
      - operations
      operationId: getOperation
      summary: Детали операции
      description: Необязательные поля приходят, только если источник их поставляет; клиент показывает строку по наличию поля.
      parameters:
      - $ref: '#/components/parameters/OperationId'
      - name: occurred_at
        in: query
        required: true
        description: Время совершения записи — значение `occurred_at` из записи списка или поиска (`listOperations`)
          как есть; у пары — время списания. `+` в смещении кодируется как `%2B`. Нет — 400 `VALIDATION_ERROR`.
          Неверное время — не ошибка — сервер ищет запись по ID за всё время (FIN-202).
        schema:
          type: string
          format: date-time
        example: '2026-09-25T19:11:00+03:00'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/XClientVersion'
      responses:
        '200':
          description: Операция
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationDetails'
              example:
                id: 01a10812-a0e8-765b-89e4-a4314a43656f
                kind: expense
                occurred_at: '2026-09-25T19:11:00+03:00'
                posted_at: null
                amount: 234000
                currency: RUB
                title: Пятёрочка
                description: Пятёрочка
                category_id: cat_supermarkets
                category_name: Супермаркеты
                category_icon: cart
                is_category_manual: false
                note: null
                note_details: null
                bank_category: Супермаркеты
                account:
                  type_name: Текущий
                  mask: ··4821
                  spoken: текущий счёт, последние цифры 4821
                status: posted
                source_name: Выписка Т-Банка
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      tags:
      - operations
      operationId: changeOperationCategory
      summary: Сменить категорию
      description: |
        - Обычная операция: меняется её категория, `items` — одна запись.
        - Пара `own_transfer`: смена на любую категорию, кроме «Между своими счетами», разделяет пару на две
          операции. Выбранная категория — стороне, к которой подходит (расходная — списанию, доходная —
          зачислению, подходящая к обеим — списанию); другая сторона получает категорию банка.
          `items` — две операции, `replaced_id` — ID пары.
        - Операция с категорией «Между своими счетами», у которой нашлась вторая сторона, становится парой:
          `items` — пара, `replaced_id` — ID операции.

        Ручная правка не перетирается при повторном импорте. Аналитика за затронутый месяц пересчитывается
        асинхронно.
      parameters:
      - $ref: '#/components/parameters/OperationId'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/XClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeCategoryRequest'
            example:
              category_id: cat_restaurants
              occurred_at: '2026-09-25T19:11:00+03:00'
      responses:
        '200':
          description: Изменённые записи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeCategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
