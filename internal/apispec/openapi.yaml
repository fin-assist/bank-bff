      - gaps
      properties:
        upload_count:
          type: integer
        operation_count:
          type: integer
          description: Операций всего, без повторов.
        first_operation_at:
          type: string
          format: date-time
        last_operation_at:
          type: string
          format: date-time
        gaps:
          type: array
          description: Дни без данных ни в одном файле.
          items:
            $ref: '#/components/schemas/Range'
    Upload:
      type: object
      required:
      - upload_id
      - file_name
      - status
      - uploaded_at
      - operation_count
      - unread_count
      - source_name
      properties:
        upload_id:
          type: string
        file_name:
          type: string
        status:
          type: string
          description: '`processing` — ещё разбирается (клиент открывает поток прогресса); `done`. Неизвестный — как `done`.'
          x-extensible-enum:
          - processing
          - done
        uploaded_at:
          type: string
          format: date-time
        operation_count:
          type: integer
          description: Операций прочитано из файла (включая уже бывшие в других загрузках).
        unread_count:
          type: integer
          description: |
            Непрочитанных строк, которые ещё не закрыты. Строки, закрытые более поздней загрузкой (дочитанные или заменённые
            её записью), сюда не входят (api.md 3.6, «Закрытие строк»; FIN-79).
        resolved_unread_count:
          type: integer
          minimum: 0
          description: |
            Строк этой загрузки, дочитанных более поздними загрузками; нет или 0 — таких нет. Строки, заменённые
            записью более поздней загрузки (снова не прочитались), не входят.
        resolved_by_uploaded_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Когда загружена самая поздняя из загрузок, дочитавших строки («Строки дочитаны в загрузке от 12 октября»).
            Есть, только если `resolved_unread_count` > 0.
        period_from:
          type: string
          format: date
          nullable: true
          description: |
            Первый день периода файла `YYYY-MM-DD` в поясе профиля, включительно (api.md 3.4; FIN-197): день
            минимального `DTSTART` по счетам файла (блоки, где есть и `DTSTART`, и `DTEND`); если таких блоков нет —
            день первой операции файла (docs/calc.md, раздел 4). Приходит вместе с `period_to`: оба есть или обоих нет.
            Нет у загрузки в статусе `processing` и у файла без периода и без операций.
          example: '2026-04-01'
        period_to:
          type: string
          format: date
          nullable: true
          description: |
            Последний день периода файла `YYYY-MM-DD` в поясе профиля, включительно (api.md 3.4; FIN-197): день
            максимального `DTEND` по счетам файла (блоки, где есть оба тега); если таких блоков нет — день последней
            операции файла. Приходит вместе с `period_from`.
          example: '2026-09-30'
        source_name:
          type: string
          description: Название источника для показа («Выписка Т-Банка»); клиент по нему не ветвится.
    UnreadLinesList:
      type: object
      required:
      - lines
      properties:
        lines:
          type: array
          description: Незакрытые непрочитанные строки по порядку в файле.
          items:
            $ref: '#/components/schemas/UnreadLine'
    UnreadLine:
      type: object
      required:
      - upload_id
      - file_name
      - line_number
      - reason
      - reason_name
      properties:
        upload_id:
          type: string
        file_name:
          type: string
        line_number:
          type: integer
          minimum: 1
        date:
          type: string
          format: date-time
          nullable: true
          description: Дата операции, если её удалось прочитать.
        reason:
          type: string
          description: |
            Для статистики; показывается `reason_name`. Непрочитанной строку делает только то, без чего операцию
            нельзя учесть: сумма, дата, целостность строки. Отсутствие описания строку не блокирует — операция
            принимается с пустым `title` (FIN-67).
          x-extensible-enum:
          - bad_amount
          - bad_date
          - no_date
          - truncated
        reason_name:
          type: string
          description: Причина для показа.
    Account:
      type: object
      required:
      - type_name
      properties:
        type_name:
          type: string
          description: Тип счёта для показа («Текущий»).
        mask:
          type: string
          nullable: true
          description: Последние цифры («··4821»); нет у счёта другого банка.
    AccountDetails:
      allOf:
      - $ref: '#/components/schemas/Account'
      - type: object
        required:
        - spoken
        properties:
          spoken:
            type: string
            description: Подпись счёта для TalkBack («текущий счёт, последние цифры 4821»).
    OperationBase:
      type: object
      required:
      - id
      - kind
      - occurred_at
      - amount
      - currency
      - title
      - category_id
      - category_name
      - category_icon
      - is_category_manual
      - status
      properties:
        id:
          type: string
          description: ID операции или пары переводов.
        kind:
          type: string
          description: |
            `expense` — списание; `income` — зачисление; `own_transfer` — пара переводов между своими счетами.
            Неизвестное значение — показывать сумму без знака и без цвета.
          x-extensible-enum:
          - expense
          - income
          - own_transfer
        occurred_at:
          type: string
          format: date-time
          description: Время совершения; у пары — время списания.
        amount:
          type: integer
          format: int64
          minimum: 0
          description: Сумма, копейки, без знака — направление задаёт `kind`.
        currency:
          type: string
          description: ISO 4217.
          example: RUB
        title:
          type: string
          description: Описание из выписки; у пары — «Перевод между счетами». Может быть пустой строкой, если
            в выписке описания нет (FIN-67) — клиент показывает категорию банка или «Без описания».
        category_id:
          type: string
          description: Итоговая категория (с учётом ручной смены).
        category_name:
          type: string
        category_icon:
          type: string
          description: Ключ иконки, как в `Category.icon`.
        is_category_manual:
          type: boolean
          description: Категорию сменил пользователь.
        note:
          type: string
          nullable: true
          description: Как запись учтена в аналитике («не в тратах», «возврат · Различные товары»). Нет — обычным образом.
        status:
          type: string
          description: '`posted` — проведена, `pending` — холд. Неизвестный — как обычная операция, без пометки.'
          x-extensible-enum:
          - posted
          - pending
    OperationItem:
      description: Запись в ленте и в результатах поиска.
      allOf:
      - $ref: '#/components/schemas/OperationBase'
      - type: object
        properties:
          account:
            nullable: true
            allOf:
            - $ref: '#/components/schemas/Account'
            description: У `expense` и `income`.
            type: object
          from_account:
            nullable: true
            allOf:
            - $ref: '#/components/schemas/Account'
            description: У `own_transfer` — счёт списания.
            type: object
          to_account:
            nullable: true
            allOf:
            - $ref: '#/components/schemas/Account'
            description: У `own_transfer` — счёт зачисления.
            type: object
    OperationDetails:
      description: Экран операции. Необязательные поля приходят, только если источник их поставляет.
      allOf:
      - $ref: '#/components/schemas/OperationBase'
      - type: object
        required:
        - source_name
        properties:
          account:
            nullable: true
            allOf:
            - $ref: '#/components/schemas/AccountDetails'
            type: object
          from_account:
            nullable: true
            allOf:
            - $ref: '#/components/schemas/AccountDetails'
            type: object
          to_account:
            nullable: true
            allOf:
            - $ref: '#/components/schemas/AccountDetails'
            type: object
          description:
            type: string
            nullable: true
            description: Описание из выписки как есть; у пары — нет.
          posted_at:
            type: string
            format: date-time
            nullable: true
            description: Время проведения банком; нет, если источник не сообщает.
          note_details:
            type: string
            nullable: true
            description: Развёрнутая версия `note` под категорией («Уменьшает расходы «Различные товары» в сентябре»).
          bank_category:
            type: string
            nullable: true
            maxLength: 64
            description: Категория банка как в выписке, обрезанная до 64 символов; у пары — нет.
          mcc:
            type: string
            nullable: true
            description: MCC торговой точки, если источник сообщает (в OFX Т-Банка нет).
          source_name:
            type: string
            description: Название источника («Выписка Т-Банка»).
    OperationsList:
      type: object
      description: |
        Лента: `items`, `summary`, `state`, `range`, `next_before`. Поиск: `items`, `total_count`, `range`,
        `has_older_data`. Группировку по дням и месяцам клиент делает сам по `occurred_at` в поясе профиля.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OperationItem'
        summary:
          type: array
          description: Только в ленте — сводка по месяцам порции, новые первыми; по правилам «Аналитики» в режиме «С переводами».
          items:
            $ref: '#/components/schemas/MonthSummary'
        state:
          $ref: '#/components/schemas/FeedState'
        range:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Range'
          description: Лента — границы порции. Поиск — фактический период; нет при `all_time` и при одной переданной границе.
          type: object
        next_before:
          type: string
          format: date-time
          nullable: true
          description: Только в ленте — `before` для следующей порции; нет — раньше операций нет.
        total_count:
          type: integer
          description: Только в поиске — «Найдено 9 операций».
        has_older_data:
          type: boolean
          nullable: true
          description: Только в поиске с периодом по умолчанию — есть операции раньше `range.from` («Искать за всё время»).
    MonthSummary:
      type: object
      required:
      - month
      - range
      - expense
      - income
      properties:
        month:
          $ref: '#/components/schemas/Month'
        range:
          $ref: '#/components/schemas/Range'
        expense:
          type: integer
          format: int64
          description: Расходы за вычетом возвратов, со знаком.
        income:
          type: integer
          format: int64
          description: Доходы, со знаком.
        data_to:
          type: string
          format: date-time
          nullable: true
          description: Есть, если месяц неполный — конец данных по покрытым дням (docs/api.md, «Формат») — время последней
            операции, если она в последний покрытый день, иначе 23:59:59 этого дня. День берётся как есть («по 25
            сентября»); не граница дня, в отличие от `FeedState.data_to`.
    FeedState:
      type: object
      description: Только в ленте.
      required:
      - stale
      properties:
        stale:
          type: boolean
          description: Выписка устарела — последний покрытый периодом выписки день (`DTEND`, по всем загрузкам) больше
            двух недель назад; от последней операции не зависит (FIN-124). Переключается в начале 15-го календарного дня
            после последнего покрытого в поясе профиля — одновременно с `AnalyticsState.stale`. Загрузка без операций тоже
            покрывает дни. Нет покрытых дней — `true`, `data_to` нет. Плашка — при `data_to` и `last_operation_at`; без
            `last_operation_at` — пустое состояние без плашки.
            Порог — на сервере.
        data_to:
          type: string
          format: date-time
          nullable: true
          description: Конец данных по всем загрузкам — начало дня, следующего за последним покрытым днём (полуинтервал).
            Последний покрытый день — день перед `data_to` («Данные в приложении по 25 сентября»). Покрытые дни дают и
            загрузки без операций. Нет — нет ни одной загрузки в статусе `done` с покрытыми днями.
        last_operation_at:
          type: string
          format: date-time
          nullable: true
          description: Время последней операции; для устаревания не используется.
        last_uploaded_at:
          type: string
          format: date-time
          nullable: true
    ChangeCategoryRequest:
      type: object
      required:
      - category_id
      - occurred_at
      properties:
        category_id:
          type: string
          description: Категория с `assignable`, у которой `kinds` включает `kind` записи; для пары — любая с `assignable`.
            Иначе 422 `CATEGORY_NOT_ASSIGNABLE` — клиент перечитывает справочник (`listCategories`) и перестраивает выбор.
        occurred_at:
          type: string
          format: date-time
          description: Время совершения записи — значение `occurred_at` из записи списка, поиска или деталей как есть;
            у пары — время списания. Нет — 400 `VALIDATION_ERROR`. Неверное время — не ошибка — сервер ищет запись по
            ID за всё время (FIN-202).
    ChangeCategoryResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          description: Изменённые записи целиком.
          items:
            $ref: '#/components/schemas/OperationDetails'
        replaced_id:
          type: string
          nullable: true
          description: Есть, если запись с этим ID перестала существовать — клиент заменяет её на `items`.
    CategoriesList:
      type: object
      required:
      - categories
      properties:
        categories:
          type: array
          description: Все категории в порядке отображения.
          items:
            $ref: '#/components/schemas/Category'
    Category:
      type: object
      required:
      - id
      - name
      - icon
      - is_system
      - kinds
      - assignable
      properties:
        id:
          type: string
          description: Стабильный непрозрачный ключ (`cat_supermarkets`).
        name:
          type: string
          maxLength: 64
          description: Название; у категории банка — из выписки, обрезано до 64 символов.
        icon:
          type: string
          description: Ключ иконки из набора приложения; неизвестный — иконка по умолчанию.
        is_system:
          type: boolean
          description: Системная категория («Между своими счетами», «Возврат», «Без категории» — `cat_uncategorized`)
            — группа «Системные» сверху в выборе.
        kinds:
          type: array
          description: К каким записям применима. Неизвестные значения клиент пропускает.
          items:
            type: string
            x-extensible-enum:
            - expense
            - income
        assignable:
          type: boolean
          description: Можно выбрать при ручной смене категории.
        note:
          type: string
          nullable: true
          description: Подпись в выборе («не в тратах»); есть только у системных.
    Analytics:
      type: object
      description: 'Ответ экрана «Аналитика». При `has_data: false` остальных полей нет.'
      required:
      - has_data
      properties:
        has_data:
          type: boolean
          description: Есть ли у пользователя хоть одна операция и хоть один покрытый выпиской день. `false` — пустое состояние
            «Аналитики пока нет».
        params:
          allOf:
          - $ref: '#/components/schemas/AnalyticsParams'
          description: Фактические параметры ответа — `period`, точный `date`, `transfer_mode`.
        currency:
          type: string
          description: 'Валюта всех сумм ответа (ISO 4217); есть всегда при `has_data: true`, сейчас — `RUB`.'
        period:
          $ref: '#/components/schemas/AnalyticsPeriodInfo'
        navigation:
          $ref: '#/components/schemas/AnalyticsNavigation'
        blocks:
          type: array
          description: |
            Блоки экрана по порядку (FIN-4). Состав и порядок решает сервер; клиент рисует их подряд, пропуская
            неизвестные, несовместимые, выключенные флагом `analytics.block.<id>` и те, что не удалось разобрать.
          items:
            $ref: '#/components/schemas/Block'
        state:
          $ref: '#/components/schemas/AnalyticsState'
    AnalyticsPeriodInfo:
      type: object
      required:
      - range
      - is_current
      - coverage
      - gaps
      properties:
        range:
          $ref: '#/components/schemas/Range'
        is_current:
          type: boolean
          description: Период ещё идёт.
        coverage:
          $ref: '#/components/schemas/Coverage'
        data_from:
          type: string
          format: date-time
          nullable: true
          description: Начало данных внутри периода — 00:00 первого покрытого выпиской дня в периоде (docs/api.md,
            «Формат»); нет — в периоде нет покрытых дней.
        data_to:
          type: string
          format: date-time
          nullable: true
          description: Конец данных внутри периода — время последней операции, если она в последний покрытый день, иначе
            23:59:59 этого дня. День берётся как есть («1–25 сентября»); не граница дня, в отличие от
            `AnalyticsState.data_to`.
        gaps:
          type: array
          description: Дни без данных ни в одной загрузке между первым и последним покрытым днём. Пропуск, пересекающий
            период, приходит целиком, без обрезки границами периода (docs/calc.md, раздел 4).
          items:
            $ref: '#/components/schemas/Range'
    AnalyticsNavigation:
      type: object
      properties:
        previous:
          type: string
          description: '`date` предыдущего периода с данными (сосед в `listAnalyticsPeriods`); `null` — стрелка недоступна.'
          pattern: ^\d{4}(-(0[1-9]|1[0-2])|-Q[1-4])?$
          nullable: true
        next:
          type: string
          description: '`date` следующего периода с данными (сосед в `listAnalyticsPeriods`); `null` — стрелка недоступна.'
          pattern: ^\d{4}(-(0[1-9]|1[0-2])|-Q[1-4])?$
          nullable: true
    AnalyticsState:
      type: object
      required:
      - stale
      - data_from
      - data_to
      - full_months
      - unread_lines_count
      - calculated_at
      - recalculating
      properties:
        stale:
          type: boolean
          description: Выписка устарела — последний покрытый периодом выписки день (`DTEND`, по всем загрузкам) больше
            двух недель назад; от последней операции не зависит (FIN-124). Порог — на сервере.
        last_operation_at:
          type: string
          format: date-time
          nullable: true
          description: Время последней загруженной операции; для устаревания не используется.
        data_from:
          type: string
          format: date-time
          description: Начало первого покрытого дня по всем загрузкам — для текста блокировки при нуле полных месяцев.
        data_to:
          type: string
          format: date-time
          description: Начало дня, следующего за последним покрытым днём по всем загрузкам (полуинтервал); плашка
            устаревания — «Данные в приложении по <день перед data_to>».
        full_months:
          type: integer
        unread_lines_count:
          type: integer
          description: Незакрытых непрочитанных строк за выбранный период (`listUnreadLines` с `from`/`to` периода; FIN-79).
        calculated_at:
          type: string
          format: date-time
        recalculating:
          type: boolean
          description: |
            Идёт пересчёт, вызванный действием пользователя (импорт выписки, смена категории, удаление загрузки, смена
            часового пояса, «Не подписка») — цифры могут измениться, клиент обновит экран позже. Пересчёт после релиза, меняющего реестр,
            признак не ставит: снимки заменяются молча, по месяцам (FIN-196).
    AnalyticsPeriodsList:
      type: object
      required:
      - periods
      properties:
        periods:
          type: array
          description: Периоды с покрытыми выпиской днями, новые первыми. Пустой — данных нет.
          items:
            $ref: '#/components/schemas/AnalyticsPeriodItem'
    AnalyticsPeriodItem:
      type: object
      required:
      - key
      - range
      - coverage
      properties:
        key:
          $ref: '#/components/schemas/PeriodKey'
        range:
          $ref: '#/components/schemas/Range'
        coverage:
          type: string
          description: Как `AnalyticsPeriodInfo.coverage`, кроме `no_data`.
          x-extensible-enum:
          - complete
          - partial
          - no_data
    AskRequest:
      type: object
      required:
      - text
      properties:
        text:
          type: string
