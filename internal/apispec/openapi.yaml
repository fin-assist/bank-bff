openapi: 3.0.3
info:
  title: Понятные финансы — клиентский API
  version: 1.0.0-mvp
  description: |
    Клиентский API приложения «Понятные финансы» (MVP). Источник правды по смыслу полей — `docs/api.md` в этом репозитории;
    этот файл — машиночитаемый контракт для кодогенерации, валидации (kin-openapi) и контроля
    несовместимых изменений (oasdiff в CI).

    **Транспорт:** HTTP/2 REST + SSE. Версия — в пути (`/v1`).

    **Соглашения:**
    - Моменты времени — `date-time` с часовым поясом. Диапазоны — полуинтервал `[from, to)`.
    - Календарные единицы считаются в часовом поясе профиля; исключение — сброс лимита помощника по Москве.
    - Деньги — целые копейки (`int64`). Сумма операции ≥ 0, суммы аналитики и помощника — со знаком.
    - ID — непрозрачные строки (сейчас UUIDv7); клиент их не разбирает и не конструирует.
    - В ответах поле, которого нет в `required`, может отсутствовать; если у него `nullable`, может прийти и
      `null` — клиент обрабатывает оба случая одинаково. В запросах необязательное поле просто не передаётся
      (`null` не отправляется).
    - **Закрытые наборы** — `enum`: новое значение = несовместимое изменение.
      **Открытые наборы** — `string` с `x-extensible-enum`: известные значения перечислены, новое значение
      совместимо, клиент обязан обработать неизвестное (поведение указано в описании поля).
      Генераторы не делают из `x-extensible-enum` закрытый тип — неизвестное значение не роняет разбор.
    - Полиморфные объекты (блок ответа помощника, чип) — плоские объекты с полем-типом, без `oneOf` и
      дискриминатора: неизвестный тип разбирается и обрабатывается по правилу поля.
    - Все ответы — объекты. Неизвестные поля клиент игнорирует.

    **Время ожидания и часы** (`docs/api.md`): datetime — абсолютный RFC3339 момент, не разность с часами
    телефона. Для ожидания приоритетны свежие Retry-After в секундах/RetryInfo и expires_in; клиент уменьшает
    длительность по монотонному elapsed time с учётом сна. BFF формирует свежий Date во всех ответах,
    включая4xx/5xx и replay, не копирует сохранённую дату. Только для приблизительного UI при datetime без
    duration допустим target_datetime минус Date ТОГО ЖЕ свежего ответа с последующим вычитанием elapsed time.
    Часы BFF/сервиса должны быть синхронизированы; сеть/точность Date делают оценку приблизительной.
    Для свежей duration Date не требуется. Если срок только datetime и свежего Date нет — обновить состояние
    по существующему разрешённому сценарию, до него без точного countdown. После reboot/потери monotonic anchor
    обновление требуется для любого прежнего срока; cached Date/старую duration заново не запускать.
    Это не proof авторизации, ключа или permission. Местная подпись верификации «до ЧЧ:ММ» сохраняется,
    но отсчёт не зависит от смены wall clock/пояса. Новые server_time или *_in поля не вводятся.

    **Заголовки:** `X-Request-Id` (клиент генерирует на каждую попытку, сервер возвращает эхом во всех ответах);
    `Idempotency-Key` — на POST с побочным эффектом (у операции указан как обязательный параметр);
    `X-Client-Version` — версия клиента, обязательна на всех запросах (FIN-20): ниже минимальной для
    платформы, нет заголовка, значение не разобрано или платформа неизвестна — 400 `CLIENT_VERSION_UNSUPPORTED`;
    свежий `Date` — во всех ответах BFF, включая ошибки;
    `Retry-After` в секундах — у 429, 409 `REQUEST_IN_PROGRESS` и 503 `MAINTENANCE`.

    **Универсальные внутренние ошибки**: google.rpc.Status + ErrorInfo/BadRequest/RetryInfo и optional
    common.v1.RequestRetryInfo. Permission исходного RPC задаёт сервис/usecase; BFF соединяет его с доказанной
    безопасностью ВСЕГО внешнего REST-запроса для Error.retryable и формирует UI-каталог, без business-switch
    по коду. Unary transport errors используют прежний HTTP/error_spec реестр. Вложенный Status failed-result
    не превращает успешное чтение/stream RPC в отказ; в initial result profile нет RequestRetryInfo/RetryInfo.
    Новая попытка операции и доменные данные остаются во внешнем результате, не в общем механизме.
    Внутренние additive Status поля не добавляются в клиентский JSON: BFF переносит валидный открытый reason
    в code/error_code, даже если его нет в unary registry, и формирует безопасный текст. Нет Status — legacy
    adapter; присутствующий невалидный Status — безопасный failed-result fallback/метрика: assistant terminal
    code=INTERNAL_ERROR, failed history error_code=INTERNAL_ERROR (не null), import code=PROCESSING_FAILED;
    legacy-код не читается. Явный внешний domain retryable сохраняется от сервиса независимо от ошибки.
    Действия REST-реестра относятся к REST Error и явно описанным контекстам общего ErrorEvent; совпадение
    reason в AnswerErrorEvent/StreamError/истории не включает REST auth/maintenance/quota или resume исходного Ask. Порядок dual-write/нового gen/go тега/rollback — docs/grpc-api.md5.4–5.5.

    **Ошибки:** всегда один объект `error` (см. `ErrorResponse`). Порядок проверки:
    503 (`MAINTENANCE`) → 400 `CLIENT_VERSION_UNSUPPORTED` → 401 (заголовок `Authorization`) → 400/413 проверки
    `bank-bff` (нет `Idempotency-Key`, тело не по схеме, `Content-Length` больше лимита и ограниченное чтение; у шести JSON-операций — по правилам ниже) → ключ идемпотентности (сохранённый ответ
    или 409) → 429 → 401 (токены запроса, которые проверяет сервис: `registration_token`, `refresh_token` в теле,
    `X-Verification-Token` в заголовке; у потока статуса верификации ключа нет — шаг сразу после лимитов) → 400 →
    404 → 403 → 413/422. У `POST /v1/statements` 413 `FILE_TOO_LARGE` сервиса — до ключа (под ключом не
    сохраняется), остальные ответы сверяют ключ после приёма всего файла.
    503 и 400 `CLIENT_VERSION_UNSUPPORTED` возможны у любой операции.

    **Размер JSON-запроса (FIN-339):** только startPhoneVerification, register, refreshTokens, logout,
    grantAssistantConsent и askAssistant имеют x-min-request-body-bytes: 65536. Тело до 65 536 байт
    включительно поддерживается всегда; предел развёртывания может быть выше, но не ниже. Считаются все
    байты UTF-8 JSON, включая пробелы/escape, независимо от лимитов полей. Превышение фактического предела
    по Content-Length или ограниченному чтению потока без него — 413 REQUEST_TOO_LARGE до сервиса/ключа,
    без сохранения отказа и с retryable:false. Исправленное тело — новое действие (новый ключ, если операция требует Idempotency-Key), не автоматический retry.
    У этих шести операций Content-Encoding отсутствует либо содержит один identity (без учёта регистра);
    все другие значения, включая gzip/br, список или несколько Content-Encoding, — 400 VALIDATION_ERROR
    после техработ/версии/авторизации, но до чтения тела/размера/распаковки/сервиса, не новый 415.
    HTTP-парсер нормализует OWS; пустое значение не равно отсутствию.
    BFF и инфраструктура перед ним не распаковывают такое тело: wire-байты совпадают с байтами JSON.
    Остальные восемь операций набора FIN-268 (включая retryAnswer) принимают только фактические 0 байт:
    Content-Length:0, пустой chunked и Content-Type:application/json без байтов допустимы; отсутствие
    Content-Type тоже. От 1 байта, включая {} или пробел, — 400 VALIDATION_ERROR после чтения не более
    одного байта для обнаружения тела; заголовки сами по себе не означают тело, новый 413 не вводится.
    У прочих операций с телом прежние Content-Length/ограниченное чтение/413 до валидации и сервиса сохраняются;
    для остальных JSON-операций код и байтовый бюджет этого отказа контракт пока не определяет —
    последующее согласование FIN-225 вне реализации FIN-268. REQUEST_TOO_LARGE/минимум65536 на них не распространяются.
    Файловый FILE_TOO_LARGE и его лимит остаются прежними (docs/api.md, «Размер JSON-запроса»).

    **SSE:** первым событием — текущее состояние целиком; после терминального события поток закрывается;
    heartbeat `: ping` каждые 15 с; ошибки до начала потока — обычный HTTP-ответ с JSON. Неизвестный тип
    события клиент игнорирует. События потока описаны расширением `x-sse-events` (имя события → схема `data`).
    Веб-клиент читает поток через `fetch`, не `EventSource` (нужны заголовки).

    **SSE — переподключение** (`docs/api.md`, «SSE»; FIN-159): поток, закрытый без терминального события, —
    обрыв, клиент переоткрывает его. Базовая пауза d — 1 с, после каждого обрыва удваивается до 30 с; фактическая
    пауза — случайная в [0,5·d; d]. d сбрасывается до 1 с, когда поток проработал без обрыва 30 с или пришло
    терминальное событие (одного первого события мало). На 429 при переоткрытии — пауза до `retry_at`
    (`Retry-After`) плюс случайные [0; 0,5·d]; d при этом удваивается, как после обрыва. Терминальное событие
    `error` — только доменный исход потока; сбой сервера или транспорта посреди потока — закрытие без терминального
    события, то есть обрыв по этому правилу.

    При REST-отказе до открытия/переоткрытия SSE корректный error.retryable=false запрещает прямой повтор и
    автоматическое переоткрытие в неизменённом контексте, даже по прежнему таймеру429/409. true разрешает повтор только при выполнении
    условий ожидания, метода и окна ключа; отсутствующий/некорректный флаг сохраняет прежний безопасный алгоритм.
    Корректирующие сценарии, обрыв без тела и доменный retryable помощника — отдельные правила. Успешный
    auth-flow сохраняет предусмотренную отправку исходной операции с новым Authorization и ПРЕЖНИМ ключом
    при доказанных safety/TTL. Известный MAINTENANCE сохраняет один контролируемый resume после Retry-After
    в своём сценарии экрана техработ с тем же ключом и проверками; повторный отказ не запускает auto-loop.
    Это не разрешение неизвестного кода или общего таймера; ввод пользователя сохраняется.

    **Кодогенерация:** для SSE-операций (`streamPhoneVerification`, `streamStatementProgress`, `streamAnswer`)
    генерируются только модели событий; сам поток клиент читает вручную (OkHttp SSE, `URLSession` bytes, `fetch`) —
    сгенерированные клиенты читают тело целиком и блокируются до конца потока. На сервере эти маршруты
    исключаются из валидации ответов kin-openapi (у неё нет декодера `text/event-stream`).

    **Правила правки этого файла:** примитивные схемы (`Money`, `Month`, `PeriodKey`, открытые коды) в полях с
    собственным описанием записываются целиком, без обёртки `allOf` — часть генераторов её не переносит;
    необязательный объект-ссылка, который может быть `null`, — `type` + `nullable: true` + `allOf: [$ref]`
    (без `type` по OAS 3.0.3 `null` не допускается). Новый `POST` с побочным эффектом обязан требовать
    `Idempotency-Key`. Несовместимые изменения ловит oasdiff в CI.
servers:
- url: https://api.example.ru
  description: Продакшн (адрес — заглушка, заменить)
security:
- bearerAuth: []
tags:
- name: auth
  description: Вход по номеру телефона и обратному звонку
- name: profile
  description: Профиль, настройки, согласия
- name: statements
  description: Загрузка и история выписок
- name: operations
  description: Лента, поиск и правка операций
- name: categories
  description: Справочник категорий
- name: analytics
  description: Экран «Аналитика»
- name: assistant
  description: Помощник (Alice AI)
paths:
  /v1/auth/phone:
    post:
      tags:
      - auth
      operationId: startPhoneVerification
      x-min-request-body-bytes: 65536
      summary: Начать верификацию телефона
      description: |
        Создаёт заявку на подтверждение номера обратным звонком. До подтверждения API не сообщает,
        зарегистрирован ли номер. Повтор с тем же `Idempotency-Key` возвращает ту же заявку и не расходует
        лимит верификаций — в том числе после `expires_at` (ответ хранится 24 ч), поэтому новая заявка — с новым
        ключом.

        Ключ проверяется до лимитов: повтор с известным ключом и тем же телом получает сохранённый ответ без
        проверок ниже; тот же ключ с другим телом — 409 `IDEMPOTENCY_CONFLICT`, а не 429. Для неизвестного ключа —
        сначала лимиты верификаций на номер и на адрес (при превышении `retry_at` — срок лимита, занятость номера не
        проверяется), затем занятость номера.

        Провайдер не принимает повторную заявку на тот же номер до конца срока предыдущей, даже если по ней уже
        вошли. Поэтому номер занят до `expires_at` последней заявки на него, закрыта она или нет (действующая заявка —
        `pending` до `expires_at` или `verified` с неиспользованным результатом до 15 минут с подтверждения — отдельное
        понятие, от неё зависит повторная доставка результата). Запрос с новым ключом на занятый номер — 429 `RATE_LIMITED` без обращения к провайдеру и без
        `verification_token` чужой заявки; `error.retry_at` — `expires_at` последней заявки, округлённый вверх до целой
        минуты (22:16:20 → 22:17:00). Отказ провайдера по дублю при свободном по БД номере — тоже 429, `retry_at` =
        время запроса + 5 минут, округлённое вверх до минуты. 429 на дубль сохраняется под ключом до своего
        `retry_at` (повтор с тем же ключом получает его с `Retry-After` от текущего момента, занятость не перепроверяется) и засчитывается в лимитах на
        номер и на адрес — один ключ не больше одного раза на окно до `retry_at`. 429 по лимиту не сохраняется и
        попытку не списывает.

        Срок на устройстве: expires_in уменьшается по монотонному elapsed time с учётом сна; перевод часов
        не перезапускает ожидание. Подпись «до ЧЧ:ММ» остаётся местной: часы получения плюс длительность.
        Нет expires_in — приблизительный UI-fallback expires_at минус Date ТОГО ЖЕ свежего ответа, затем
        вычитание elapsed time. Без свежего Date/монотонной базы — обновить состояние по существующему сценарию,
        без точного countdown до обновления; старую duration не запускать снова (info.description).

        Клиент со своей действующей заявкой (`pending` или `verified` с неиспользованным результатом) новую на тот же
        номер не создаёт. Номер подтверждения показывает, только пока своя заявка `pending` и её срок на устройстве не
        прошёл; убирает при `expired`, при наступлении срока на устройстве по таймеру (переоткрывает поток: `expired` или 401
        `INVALID_TOKEN` — конец заявки, `pending` — вернуть номер и ждать по потоку) и при 429,
        полученном без своей действующей заявки.
      security: []
      parameters:
      - $ref: '#/components/parameters/ContentEncodingIdentity'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/XClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartPhoneVerificationRequest'
            example:
              phone: '+79001234567'
      responses:
        '200':
          description: Заявка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneVerification'
              example:
                verification_token: vt_9mQ2x7LpR4aZ8cN1kT6wY3eB5uH0jV2sD4fG7hK9lP1
                callback_number: '+74951234567'
                expires_at: '2026-10-04T22:17:00+03:00'
                expires_in: 300
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/phone/events:
    get:
      tags:
      - auth
      operationId: streamPhoneVerification
      summary: Статус верификации (SSE)
      description: |
        Поток статуса заявки. Клиент открывает его после `ACTION_DIAL` и переоткрывает при возврате из фона.
        Первое событие — текущий статус. Результат `verified` доступен 15 минут с момента подтверждения звонком (не до
        `expires_at`): переподключение с тем же токеном отдаёт те же токены. Заявка закрывается первым
        `/v1/auth/token` с выданным refresh или `/v1/auth/register`; после этого, после 15 минут с подтверждения и для
        `pending` — после `expires_at` — 401 `INVALID_TOKEN`.

        Лимит запросов (попыток подключения) за окно на адрес клиента, как у 1.3 и 1.4 (значение задаёт сервер;
        считаются и попытки, отклонённые по токену): сверх него — 429 `RATE_LIMITED` с
        `error.retry_at` до начала потока и до проверки `X-Verification-Token`.
        Корректный REST error.retryable=false запрещает повторное открытие после этого отказа; при true клиент
        ждёт retry_at и проверяет условия заявки, при отсутствующем/некорректном флаге — прежний безопасный сценарий.

        Терминальные события: `status` с `verified` или `expired`.
        Переподключение после обрыва — по правилу «SSE — переподключение» (`info.description`).
      security:
      - verificationToken: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/XClientVersion'
      responses:
        '200':
          description: Поток событий
          content:
            text/event-stream:
              schema:
                type: string
                description: 'SSE-поток. События: `status` → `PhoneVerificationStatusEvent`, `error` → `ErrorEvent`.'
              example: |
                event: status
                data: {"status": "pending"}

                event: status
                data: {"status": "verified", "is_new_user": true, "registration_token": "reg_..."}
          x-sse-events:
            status:
              $ref: '#/components/schemas/PhoneVerificationStatusEvent'
            error:
              $ref: '#/components/schemas/ErrorEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/register:
    post:
      tags:
      - auth
      operationId: register
      x-min-request-body-bytes: 65536
      summary: Регистрация нового пользователя
      description: |
        Вызывается с экрана согласия на обработку ПДн после подтверждения нового номера.
        `registration_token` расходуется только ответом `201`; после ошибки 4xx его можно отправить снова
