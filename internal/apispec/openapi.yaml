      summary: Лента и поиск операций
      description: |
        **Лента** — без фильтров: порции по 3 календарных месяца, новые первыми; следующая порция — с `before`
        из `next_before`. **Поиск** — передан хотя бы один фильтр: вся выборка одним ответом (до 10 000 операций,
        больше — 422 `TOO_MANY_RESULTS`). Без периода и без `all_time` поиск идёт за последние 12 месяцев.
        `before` вместе с фильтрами, `all_time` вместе с `from`/`to` — 400.
      parameters:
      - name: from
        in: query
        description: Начало периода (включительно). Можно передать одну границу.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: Конец периода (исключительно).
        schema:
          type: string
          format: date-time
      - name: all_time
        in: query
        description: Искать за всё время, без периода по умолчанию. Вместе с `from`/`to` — 400.
        schema:
          type: boolean
      - name: q
        in: query
        description: |
          Текст из строки поиска, условия через «или»: подстрока в описании; название итоговой категории или
          категории банка; точная сумма, если `q` — число («1520», «1 520», «1520,50»); последние 4 цифры счёта.
          Без учёта регистра, «ё» = «е». Набор полей расширяемый.
        schema:
          type: string
      - name: category_id
        in: query
        description: |
          Категория. Без `transfer_mode` — итоговая категория операции. С `transfer_mode` — категория в
          аналитике: в выборку входят и возвраты, которые эту категорию уменьшили.
        schema:
          type: string
      - name: kind
        in: query
        description: |
          `expense` — только расходы, `income` — только доходы. Переводы между своими счетами не входят ни в
          один. С `transfer_mode` возвраты относятся к расходам. Открытый код (FIN-82): клиент передаёт и значение,
          которого сам не знает, если получил его в `operations_filter`; неизвестное серверу — 400.
        schema:
          $ref: '#/components/schemas/OperationKindCode'
      - name: amount_from
        in: query
        description: Сумма операции не меньше, копейки.
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: amount_to
        in: query
        description: Сумма операции не больше, копейки.
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: transfer_mode
        in: query
        description: |
          Выборка по правилам «Аналитики»: `with` — без «Между своими счетами»; `without` — ещё и без переводов.
          Неизвестное значение сервер отклоняет 400.
        schema:
          $ref: '#/components/schemas/TransferMode'
      - name: selection
        in: query
        description: |
          Непрозрачная выборка из `OperationsFilter` (карточка «Аналитики», продавец из ответа помощника,
          операции без категории). Клиент её не конструирует. Периода не содержит, действует бессрочно.
          Недействительная — 422 `SELECTION_NOT_FOUND`, клиент открывает Поиск без неё.
        schema:
          type: string
      - name: before
        in: query
        description: Только в ленте — вернуть 3 календарных месяца до этого момента. Только начало месяца в поясе
          профиля (значение next_before); другой момент или вместе с фильтрами — 400.
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/XClientVersion'
      responses:
        '200':
          description: Порция ленты или результаты поиска
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsList'
              examples:
                feed:
                  summary: Лента
                  value:
                    items:
                    - id: 01a10812-a0e8-765b-89e4-a4314a43656f
                      kind: expense
                      occurred_at: '2026-09-25T19:11:00+03:00'
                      amount: 234000
                      currency: RUB
                      title: Пятёрочка
                      category_id: cat_supermarkets
                      category_name: Супермаркеты
                      category_icon: cart
                      is_category_manual: false
                      note: null
                      account:
                        type_name: Текущий
                        mask: ··4821
                      status: posted
                    - id: 01a10812-a0e9-7c41-8d2a-5f0e3b7c9a12
                      kind: own_transfer
                      occurred_at: '2026-09-18T09:30:00+03:00'
                      amount: 2000000
                      currency: RUB
                      title: Перевод между счетами
                      category_id: cat_own_transfer
                      category_name: Между своими счетами
                      category_icon: transfer
                      is_category_manual: false
