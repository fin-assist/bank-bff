      summary: Удалить загрузку или прервать разбор
      description: |
        `done` — удаляет операции, которых нет в других загрузках, и файл; ручные правки категорий у оставшихся
        операций сохраняются; аналитика пересчитывается асинхронно. `processing` — разбор прерывается, ничего не
        сохраняется, поток прогресса завершается событием `error` с кодом `CANCELLED`.
        Повтор для уже удалённой загрузки — `204`; `404` — только если такой загрузки никогда не было.
      parameters:
      - $ref: '#/components/parameters/UploadId'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/XClientVersion'
      responses:
        '204':
