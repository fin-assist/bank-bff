      summary: Непрочитанные строки
      description: |
        Шторка «Непрочитанные строки»: по загрузке (`upload_id`) или по периоду (`from` + `to`) — ровно одно из
        двух, иначе 400 `VALIDATION_ERROR`. Содержимого строк нет — оно не хранится.

        Только незакрытые строки: строки, дочитанные более поздней загрузкой или заменённые её записью, не
        возвращаются ни по загрузке, ни по периоду (api.md 3.6, «Закрытие строк»; FIN-79).

        «Сообщить нам» эндпоинта не имеет: клиент открывает `mailto:` на адрес поддержки с `user_id`,
        `upload_id`, `file_name`, номерами строк и `reason`.
      parameters:
      - name: upload_id
        in: query
        description: Строки одной загрузки.
        schema:
          type: string
      - name: from
        in: query
        description: Начало периода; строки, разобранная дата которых попадает в период. Строки без даты сюда не попадают.
        schema:
          type: string
          format: date-time
      - name: to
