      - last_operation_at
      - operation_count
      properties:
        first_operation_at:
          type: string
          format: date-time
        last_operation_at:
          type: string
          format: date-time
        operation_count:
          type: integer
          description: Операций всего.
    UploadAccepted:
      type: object
      required:
      - upload_id
      - file_name
      properties:
        upload_id:
          type: string
          description: ID загрузки — для прогресса, отмены и удаления.
        file_name:
          type: string
    ImportProgressEvent:
      type: object
      description: Событие `progress`.
      required:
      - stage
      - percent
      properties:
        stage:
          type: string
          description: '`parsing`, `dedup`, `rules`. Для логов и отладки; клиент показывает только `percent`.'
          x-extensible-enum:
          - parsing
          - dedup
          - rules
        percent:
          type: integer
          minimum: 0
          maximum: 100
    ImportResult:
      type: object
      description: Терминальное событие `complete` — всё для экрана итога импорта.
      required:
      - operation_count
      - new_count
      - duplicate_count
      - unread_count
      - is_first_import
      - accounts
      - categorized_count
      - own_transfer_count
      - uncategorized_count
      - coverage
      - notices
      - currency
      properties:
        operation_count:
          type: integer
          description: Операций прочитано из файла.
        new_count:
          type: integer
          description: Из них новых.
        duplicate_count:
          type: integer
          description: Уже были загружены — пропущены. При `new_count = 0` — «Новых операций нет».
        unread_count:
          type: integer
          description: Строк файла, которые не удалось прочитать; подробности — `listUnreadLines`.
        first_operation_at:
          type: string
          format: date-time
          nullable: true
          description: Первая операция в файле; нет, если файл пустой.
        last_operation_at:
          type: string
          format: date-time
          nullable: true
        is_first_import:
          type: boolean
          description: Первая загрузка пользователя.
        totals:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/ImportTotals'
          description: Суммы над плитками итога, по правилам аналитики («С переводами»); нет, если новых операций нет.
          type: object
        accounts:
          type: array
          description: Счета в файле.
          items:
            $ref: '#/components/schemas/ImportAccount'
        categorized_count:
          type: integer
          description: Новые операции, не вошедшие в `uncategorized_count`, — `new_count` − `uncategorized_count`.
        own_transfer_count:
          type: integer
          description: Из `categorized_count` — операций (две на пару) в категории «Между своими счетами».
        uncategorized_count:
          type: integer
          description: Без категории; входят в суммы. Новые операции в категории `cat_uncategorized` (категория банка пустая
            или буквально «Без категории») плюс возвраты, для которых не нашлась расходная категория, оба направления (FIN-126).
            В аналитике тот же набор разделён по направлениям — строки «Без категории» в «Расходах по категориям»
            (списания и возвраты) и в «Доходах по категориям» (зачисления).
        uncategorized_filters:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/OperationsFilter'
          description: Выборка для ссылки «разобрать» — `selection` «Без категории» за дни новых операций загрузки
            (`from`/`to`); может включать операции «Без категории» прошлых загрузок за те же дни.
