  /v1/statements/{upload_id}/progress:
    get:
      tags:
      - statements
      operationId: streamStatementProgress
      summary: Прогресс обработки (SSE)
      description: |
        Первое событие — текущее состояние: `progress`, а если разбор уже закончен — сразу `complete` или `error`.
        Разбор, не завершившийся за 3 минуты с начала (в том числе прерванный сбоем сервера), завершается
        `PROCESSING_FAILED`; переподключение после этого сразу отдаёт `error`.
        Терминальные события: `complete`, `error` (`PROCESSING_FAILED`, `CANCELLED`; неизвестный код — по
        корректному `user_message`, без него — общая ошибка разбора). Импорт атомарный: при ошибке ни одна операция не сохранена, файл удалён.
        Переподключение после обрыва — по правилу «SSE — переподключение» (`info.description`).
      parameters:
      - $ref: '#/components/parameters/UploadId'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/XClientVersion'
      responses:
        '200':
          description: Поток событий
          content:
            text/event-stream:
              schema:
                type: string
                description: 'SSE-поток. События: `progress` → `ImportProgressEvent`, `complete` → `ImportResult`, `error`
                  → `StreamError`.'
              example: |
                event: progress
                data: {"stage": "parsing", "percent": 20}

                event: error
                data: {"code": "PROCESSING_FAILED", "message": "..."}
          x-sse-events:
            progress:
              $ref: '#/components/schemas/ImportProgressEvent'
            complete:
              $ref: '#/components/schemas/ImportResult'
            error:
              $ref: '#/components/schemas/StreamError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/statements/unread-lines:
    get:
      tags:
