          nullable: true
          allOf:
          - $ref: '#/components/schemas/AnswerSource'
          type: object
    AnswerChunkEvent:
      type: object
      description: Событие `chunk` — фрагмент текстового блока.
      required:
      - index
      - text
      properties:
        index:
          type: integer
          minimum: 0
          description: Номер текстового блока. Равен числу полученных блоков — начинается новый; меньше — дописать в существующий.
        text:
          type: string
    AnswerBlockEvent:
      type: object
      description: Событие `block` — готовый нетекстовый блок целиком.
      required:
      - index
      - block
      properties:
        index:
          type: integer
          minimum: 0
          description: Номер блока; всегда следующий по порядку.
        block:
          $ref: '#/components/schemas/Block'
    AnswerDoneEvent:
      type: object
      description: Терминальное событие `done` — ответ готов и сохранён.
      required:
      - charged
      - remaining_limit
      properties:
        charged:
          type: boolean
          description: '`false` — данных для полного ответа не хватило (по результатам функций), попытка не списана.'
        remaining_limit:
          type: integer
    AnswerErrorEvent:
      type: object
      description: |
        Терминальное событие `error`, попытка возвращена. Клиент показывает `user_message` по общим правилам
        (при отсутствии — прежний безопасный `text`) вместо ответа, «Повторить»
        (`retryAnswer`) — только при `retryable: true`; по `code` текст не строит и о повторе не решает, поэтому
        неизвестный код обрабатывается по общим правилам пользовательского текста и `retryable`, как известный.
      required:
      - code
      - message
      - remaining_limit
      example:
        code: OFF_TOPIC
        user_message: 'Вопрос не по теме — помощник отвечает только на вопросы о ваших финансах. С другими вопросами помогут
          универсальные ассистенты: Алиса AI, GigaChat, ChatGPT, Claude, DeepSeek'
        severity: warning
        text: 'Вопрос не по теме — помощник отвечает только на вопросы о ваших финансах. С другими вопросами помогут
          универсальные ассистенты: Алиса AI, GigaChat, ChatGPT, Claude, DeepSeek'
        retryable: false
        message: off_topic tool called
        remaining_limit: 5
      properties:
        code:
          type: string
          description: |
            `MODEL_ERROR` — сбой или таймаут Alice AI либо неверный список служебных ревизий финансового инструмента
            (FIN-367): весь ответ failed, попытка возвращается, retryable=true;
            `CANNOT_ANSWER` — вопрос непонятен или на него нельзя ответить
            по данным; канонический открытый reason валидного внутреннего Status переносится как code без ограничения
            старым enum/unary-реестром. При present-invalid Status внешний code=INTERNAL_ERROR, legacy-код не читается.
            Совпадение reason с REST-кодом не включает REST auth/maintenance/quota или resume исходного Ask;
            permission новой попытки остаётся независимым внешним retryable от сервиса.
            `OFF_TOPIC` — вопрос не о данных пользователя и не о личных финансах (модель вызвала инструмент
            `off_topic`, FIN-159); `INTERNAL_ERROR` — консервативная прежняя причина при отсутствии канонического
            Status/известного legacy-кода, а также при present-invalid Status. Корректный открытый reason сохраняется, даже если его нет в каталоге;
            `user_message` и прежний `text` — из каталога BFF, `retryable` — от сервиса помощника;
            сбой самого потока — не `error`, а закрытие без терминального события.
            Каждый терминальный OFF_TOPIC также учитывается в отдельном лимите `askAssistant` / `retryAnswer`;
            повторная доставка события и чтение истории его не увеличивают (docs/api.md, раздел 7, FIN-222).
            Для аналитики и логов и для запасного правила, когда `retryable` нет.
          x-extensible-enum:
          - MODEL_ERROR
          - CANNOT_ANSWER
          - OFF_TOPIC
          - INTERNAL_ERROR
        text:
          type: string
          nullable: true
          description: |
            Прежний безопасный текст FIN-159; новый BFF заполняет тем же текстом каталога, что user_message.
            Новый клиент использует только при отсутствии user_message и корректной строке по правилам UserMessage;
            иначе — «Не получилось ответить». Сейчас: `MODEL_ERROR` — «Не получилось ответить. Вопрос не
            потрачен»; `CANNOT_ANSWER` — полный прежний текст макета `Chat` (FIN-159, без сокращения); `OFF_TOPIC` — «Вопрос не по теме — помощник отвечает только на вопросы о ваших финансах. С
            другими вопросами помогут универсальные ассистенты: Алиса AI, GigaChat, ChatGPT, Claude, DeepSeek».
        user_message:
          $ref: '#/components/schemas/UserMessage'
        severity:
          $ref: '#/components/schemas/ErrorSeverity'
        retryable:
          type: boolean
          nullable: true
          description: Доступен ли повтор (`retryAnswer`); `true` — «Повторить». Сейчас `true` только у `MODEL_ERROR`. Сервер
            присылает всегда, начиная с FIN-159; нет (старая версия сервера) — «Повторить» только при `code` = `MODEL_ERROR`.
            Это новая генерация с новым логическим POST/ключом, не повтор исходного AskQuestion и не REST Error.retryable.
        message:
          type: string
          description: Для логов и отладки, не для показа.
        remaining_limit:
          type: integer
